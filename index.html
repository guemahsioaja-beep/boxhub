<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoxHub - Maintenance</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 40px 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
    }

    p {
      color: #777;
      line-height: 1.6;
      margin: 0;
    }

    .brand {
      margin-top: 25px;
      font-weight: bold;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🔧</div>
    <h1>BoxHub sedang dalam perbaikan</h1>
    <p>
      Website sedang diperbarui untuk memberikan pengalaman
      yang lebih baik. Silakan kembali lagi nanti.
    </p>
    <div class="brand">BOXHUB</div>
  </div>
</body>
</html>
